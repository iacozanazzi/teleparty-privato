<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Videochiamata</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 13px/1.3 system-ui, sans-serif; overflow: hidden; }
    #remote { width: 100%; height: 100%; object-fit: cover; background: #111; }
    #local { position: absolute; right: 8px; top: 8px; width: 28%; border-radius: 6px; border: 1px solid #444; transform: scaleX(-1); background: #222; }
    #status { position: absolute; left: 0; right: 0; top: 40%; text-align: center; padding: 0 16px; }
    #bar { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; gap: 6px; justify-content: center; }
    button { padding: 6px 10px; font: inherit; border: 0; border-radius: 6px; background: rgba(255, 255, 255, 0.18); color: #fff; cursor: pointer; }
    button.off { background: #c11119; }
    #fallback { display: block; margin: 8px auto 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <video id="remote" autoplay playsinline></video>
  <video id="local" autoplay playsinline muted></video>
  <div id="status">Avvio della camera…</div>
  <div id="bar">
    <button id="mic" title="Microfono">Microfono</button>
    <button id="cam" title="Camera">Camera</button>
    <button id="close" title="Chiudi la videochiamata">Chiudi</button>
  </div>
  <script type="module" src="video.js"></script>
</body>
</html>
