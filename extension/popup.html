<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Watch Party</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; width: 280px; margin: 0; padding: 16px; color: #1a1a1a; background: #fff; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    p { margin: 0 0 12px; }
    button { width: 100%; padding: 8px; margin-bottom: 8px; font: inherit; border: 1px solid #888; border-radius: 6px; background: #f2f2f2; cursor: pointer; }
    button.primary { background: #c11119; border-color: #c11119; color: #fff; }
    input { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 8px; font: 12px monospace; }
    .quiet { color: #666; font-size: 12px; }
    [hidden] { display: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #eee; }
      button { background: #333; color: #eee; }
      .quiet { color: #aaa; }
    }
  </style>
</head>
<body>
  <h1>Watch Party</h1>
  <p id="message">Un momento…</p>
  <div id="no-room" hidden>
    <button id="create" class="primary">Crea stanza</button>
  </div>
  <div id="in-room" hidden>
    <input id="link" readonly aria-label="Link di invito">
    <button id="copy" class="primary">Copia link</button>
    <button id="leave">Esci dalla stanza</button>
  </div>
  <p id="note" class="quiet"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
